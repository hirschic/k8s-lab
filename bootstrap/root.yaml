apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hirschic/k8s-lab.git
    targetRevision: HEAD
    path: argocd                 # (1) the folder of Application files
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd            # (2) Applications must live in Argo's namespace
  syncPolicy:
    automated:
      prune: true                # (3) delete an Application file -> Argo deletes that Application
      selfHeal: true