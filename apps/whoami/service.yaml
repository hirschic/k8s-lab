apiVersion: v1               # core objects (Pod, Service, Secret...) are just "v1"
kind: Service
metadata:
  name: whoami               # ③ the Ingress will refer to this name
spec:
  selector:
    app: whoami              # ④ send traffic to pods labeled app=whoami (must match ②)
  ports:
    - port: 80               # the port the Service listens on
      targetPort: 80         # the port on the pod to forward to (the containerPort)
