apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: picmap
spec:
  rules:
    - host: picmap.192.168.4.65.nip.io     # home-network address (nip.io resolves to the IP inside the name)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: picmap
                port:
                  number: 80
